name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  extension_ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node Dependencies
        run: yarn

      - name: Lint Check
        run: yarn lint

      - name: Run test
        run: yarn test

      - name: Publish Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Mocha Tests
          path: ./out/results/test-results.json
          reporter: mocha-json

      - name: Package .vsix
        run: yarn package

      - name: Upload .vsix File
        uses: actions/upload-artifact@v4
        with:
          name: esp-idf-web-extension.vsix
          path: esp-idf-web-extension.vsix
